<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中英文句子练习</title>
    <script src="https://cdn.bootcdn.net/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .file-upload {
            margin-bottom: 30px;
            padding: 20px;
            border: 2px dashed #ddd;
            border-radius: 10px;
            background: #f9f9f9;
            transition: all 0.3s ease;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .file-upload input[type="file"] {
            width: 100%;
            padding: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .sentence-display {
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #chinese {
            font-size: 2em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 500;
            line-height: 1.4;
        }

        #english {
            font-size: 1.8em;
            color: #007bff;
            font-weight: 400;
            line-height: 1.4;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        #english.show {
            opacity: 1;
            transform: translateY(0);
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        #nextBtn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
        }

        #nextBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        #showAnswerBtn {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
        }

        #showAnswerBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(40, 167, 69, 0.3);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            font-size: 0.9em;
            color: #666;
        }

        .loading {
            display: none;
            margin: 20px 0;
            color: #666;
        }

        .error {
            color: #dc3545;
            margin: 10px 0;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            h1 {
                font-size: 2em;
            }
            
            #chinese {
                font-size: 1.5em;
            }
            
            #english {
                font-size: 1.3em;
            }
            
            .button-group {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>中英文句子练习</h1>
        
        <div class="file-upload">
            <input type="file" id="fileInput" accept=".csv,.xlsx,.xls" />
            <p style="margin-top: 10px; color: #666;">
                请选择包含中英文句子的CSV文件（格式：中文,英文）
            </p>
        </div>

        <div class="loading" id="loading">
            正在加载文件...
        </div>

        <div class="error" id="error"></div>

        <div class="sentence-display">
            <div id="chinese">请先上传文件</div>
            <div id="english"></div>
        </div>

        <div class="button-group">
            <button id="nextBtn" disabled>随机中文句子</button>
            <button id="showAnswerBtn" disabled>显示英文答案</button>
        </div>

        <div class="stats" id="stats">
            总句子数: 0 | 当前进度: 0/0
        </div>
    </div>

    <script>
        let sentences = [];
        let currentIndex = -1;
        let usedIndices = new Set();

        // 文件上传处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            
            loading.style.display = 'block';
            error.textContent = '';

            // 检查文件类型
            if (file.name.endsWith('.csv')) {
                parseCSV(file);
            } else if (file.name.endsWith('.xlsx') || file.name.endsWith('.xls')) {
                error.textContent = '请将Excel文件另存为CSV格式后上传';
                loading.style.display = 'none';
                return;
            } else {
                error.textContent = '请上传CSV格式的文件';
                loading.style.display = 'none';
                return;
            }
        });

        // 解析CSV文件
        function parseCSV(file) {
            Papa.parse(file, {
                header: true,
                encoding: 'UTF-8',
                complete: function(results) {
                    const loading = document.getElementById('loading');
                    const error = document.getElementById('error');
                    
                    loading.style.display = 'none';

                    if (results.errors.length > 0) {
                        error.textContent = '文件解析出错，请检查文件格式';
                        return;
                    }

                    // 过滤有效数据
                    sentences = results.data.filter(row => {
                        const chinese = row['中文'] || row['chinese'] || row['Chinese'];
                        const english = row['英文'] || row['english'] || row['English'];
                        return chinese && english && chinese.trim() && english.trim();
                    });

                    if (sentences.length === 0) {
                        error.textContent = '未找到有效的中英文句子数据，请检查文件格式';
                        return;
                    }

                    // 启用按钮
                    document.getElementById('nextBtn').disabled = false;
                    document.getElementById('showAnswerBtn').disabled = false;
                    
                    // 重置状态
                    usedIndices.clear();
                    currentIndex = -1;
                    
                    // 显示统计信息
                    updateStats();
                    
                    // 显示第一个句子
                    showRandomSentence();
                },
                error: function(error) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').textContent = '文件读取失败，请重试';
                }
            });
        }

        // 显示随机句子
        function showRandomSentence() {
            if (sentences.length === 0) return;

            // 如果所有句子都用过了，重新开始
            if (usedIndices.size >= sentences.length) {
                usedIndices.clear();
            }

            // 选择未使用的随机索引
            let availableIndices = [];
            for (let i = 0; i < sentences.length; i++) {
                if (!usedIndices.has(i)) {
                    availableIndices.push(i);
                }
            }

            currentIndex = availableIndices[Math.floor(Math.random() * availableIndices.length)];
            usedIndices.add(currentIndex);

            // 显示中文句子
            const chineseText = sentences[currentIndex]['中文'] || sentences[currentIndex]['chinese'] || sentences[currentIndex]['Chinese'];
            document.getElementById('chinese').textContent = chineseText;
            
            // 隐藏英文答案
            const englishDiv = document.getElementById('english');
            englishDiv.textContent = '';
            englishDiv.classList.remove('show');
            
            updateStats();
        }

        // 显示英文答案
        function showAnswer() {
            if (currentIndex >= 0 && currentIndex < sentences.length) {
                const englishText = sentences[currentIndex]['英文'] || sentences[currentIndex]['english'] || sentences[currentIndex]['English'];
                const englishDiv = document.getElementById('english');
                englishDiv.textContent = englishText;
                englishDiv.classList.add('show');
            }
        }

        // 更新统计信息
        function updateStats() {
            const total = sentences.length;
            const used = usedIndices.size;
            document.getElementById('stats').textContent = 
                `总句子数: ${total} | 当前进度: ${used}/${total}`;
        }

        // 按钮事件
        document.getElementById('nextBtn').addEventListener('click', showRandomSentence);
        document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);

        // 键盘快捷键
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !e.target.matches('input, textarea')) {
                e.preventDefault();
                if (!document.getElementById('nextBtn').disabled) {
                    showRandomSentence();
                }
            } else if (e.code === 'Enter' && !e.target.matches('input, textarea')) {
                e.preventDefault();
                if (!document.getElementById('showAnswerBtn').disabled) {
                    showAnswer();
                }
            }
        });
    </script>
</body>
</html>
